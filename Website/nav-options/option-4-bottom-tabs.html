<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BalanceMe — Nav Option 4: Bottom Tabs</title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* App-style navigation: mirrors the mobile app's tab bar */
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tabs {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }
    .tabs a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 76px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
    }
    .tabs a::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--placeholder);
    }
    .tabs a.is-active { background: var(--accent-soft); color: var(--accent); }
    .tabs a.is-active::before { background: var(--accent); }

    .page { padding-bottom: 140px; }

    /* On phones it becomes a full-width tab bar, like a native app */
    @media (max-width: 600px) {
      .tabs {
        left: 0;
        right: 0;
        bottom: 0;
        transform: none;
        border-radius: 0;
        border-width: 1px 0 0;
        justify-content: space-around;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      }
      .tabs a { min-width: 0; flex: 1; border-radius: 12px; padding: 6px 2px; }
      .demo-switcher { bottom: 84px; }
    }
    @media (min-width: 601px) and (max-width: 1000px) {
      .demo-switcher { bottom: 100px; }
    }
  </style>
</head>
<body data-mode="pages" data-option="4">
  <header class="header">
    <a href="#s1" class="brand" data-nav>BalanceMe</a>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#s1" data-nav>Section 1</a>
    <a href="#s2" data-nav>Section 2</a>
    <a href="#s3" data-nav>Section 3</a>
    <a href="#s4" data-nav>Section 4</a>
    <a href="#s5" data-nav>Section 5</a>
  </nav>

  <main id="content"></main>
  <script src="base.js"></script>
</body>
</html>
