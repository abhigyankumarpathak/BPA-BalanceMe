<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BalanceMe — Nav Option 3: One-Page Scroll</title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* Minimal header that sits over the page */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(244, 247, 246, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: var(--accent);
      width: 0;
    }
    .page { padding-top: 96px; }

    /* Dot navigation on the right edge */
    .dots {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    .dots a {
      position: relative;
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      transition: transform 0.2s, background 0.2s;
    }
    .dots a.is-active { background: var(--accent); transform: scale(1.3); }
    .dots a span {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-size: 0.8rem;
      background: var(--text);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .dots a:hover span { opacity: 1; }

    @media (max-width: 600px) {
      .dots { right: 10px; gap: 12px; }
      .dots a span { display: none; }
    }
  </style>
</head>
<body data-mode="scroll" data-option="3">
  <header class="header">
    <a href="#s1" class="brand">BalanceMe</a>
    <a href="#s5" style="color: var(--accent); font-weight: 600;">Jump to end &darr;</a>
    <div class="progress" id="progress"></div>
  </header>

  <nav class="dots" aria-label="Sections">
    <a href="#s1" data-nav><span>Section 1</span></a>
    <a href="#s2" data-nav><span>Section 2</span></a>
    <a href="#s3" data-nav><span>Section 3</span></a>
    <a href="#s4" data-nav><span>Section 4</span></a>
    <a href="#s5" data-nav><span>Section 5</span></a>
  </nav>

  <main id="content"></main>
  <script src="base.js"></script>
  <script>
    const bar = document.getElementById("progress");
    addEventListener("scroll", () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (scrollY / max) * 100 + "%";
    });
  </script>
</body>
</html>
